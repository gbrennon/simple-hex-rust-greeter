name: "Test in CI"

on:
  push:

jobs:
  ci:
    name: "CI — every push"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "✅ Push on branch ${{ github.ref_name }} (sha ${{ github.sha }})"
      - name: Install Rust toolchain
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - name: Run tests
        run: |
          . "$HOME/.cargo/env"
          cargo test --verbose

  merge-to-main:
    name: "CI — merge to main only"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "✅ Merged to main — sha ${{ github.sha }}"
      - name: Install Rust toolchain
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - name: Run tests on main
        run: |
          . "$HOME/.cargo/env"
          cargo test --verbose
