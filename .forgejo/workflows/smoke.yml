on:
  push:

jobs:
  ci:
    name: "CI — every push"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "✅ Push on branch ${{ github.ref_name }} (sha ${{ github.sha }})"

  merge-to-main:
    name: "CI — merge to main only"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "✅ Merged to main — sha ${{ github.sha }}"
